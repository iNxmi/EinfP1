name: Package Exercise Submission

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate exercise directory
        id: locate
        run: |
          TAG="${{ github.event.release.tag_name }}"
          RAW_NUM=$(echo "$TAG" | grep -o -E '[0-9]+' | head -n1 || true)

          if [ -n "$RAW_NUM" ]; then
            PADDED_NUM=$(printf "%02d" "$((10#$RAW_NUM))")
            TARGET_DIR="exercises/uebung$PADDED_NUM"
          fi

          if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
            FINAL_DIR="$TARGET_DIR"
          else
            echo "No matching directory found from tag ($TAG). Falling back to the first directory in exercises/."
            FINAL_DIR=$(find exercises -mindepth 1 -maxdepth 1 -type d | sort | head -n1)
            if [ -z "$FINAL_DIR" ]; then
              echo "Error: No exercise directory found under exercises/." >&2
              exit 1
            fi
          fi

          EXERCISE_NAME=$(basename "$FINAL_DIR")
          echo "target_dir=$FINAL_DIR" >> "$GITHUB_OUTPUT"
          echo "exercise_name=$EXERCISE_NAME" >> "$GITHUB_OUTPUT"

      - name: Package submission archive
        id: package
        run: |
          dir="${{ steps.locate.outputs.target_dir }}"
          matnr_file="library/matrikelnummern.txt"

          if [[ ! -d "$dir" ]]; then
            echo "Error: '$dir' is not a directory" >&2
            exit 1
          fi

          if [[ ! -f "$matnr_file" ]]; then
            echo "Error: Central file '$matnr_file' not found" >&2
            exit 1
          fi

          if [[ ! -f "$dir/erklaerung.txt" ]]; then
            echo "Error: '$dir/erklaerung.txt' not found" >&2
            exit 1
          fi

          base=""
          while IFS=',' read -r matnr _rest || [[ -n "$matnr" ]]; do
            matnr="${matnr//[[:space:]]/}"
            [[ -z "$matnr" || "$matnr" == \#* ]] && continue
            base="${base:+${base}_}${matnr}"
          done < "$matnr_file"

          if [[ -z "$base" ]]; then
            echo "Error: No matriculation numbers found in $matnr_file" >&2
            exit 1
          fi

          cp "$matnr_file" "$dir/matrikelnummern.txt"

          archive_name="${base}.tar.gz"
          out="$(pwd)/${archive_name}"
          parent="$(cd "$dir/.." && pwd)"
          name="${{ steps.locate.outputs.exercise_name }}"

          (cd "$parent" && find "$name" -type f \( -name '*.txt' -o -name '*.c' -o -name '*.h' \) -print0 \
            | tar -czf "$out" --null -T -)

          echo "archive_path=$out" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload Archive to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.package.outputs.archive_path }}#${{ steps.package.outputs.archive_name }}"

      - name: Push contents to GitLab via SSH
        if: success()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_KEY }}
          GITLAB_HOST: "gitlab.hefdi.de"
          GITLAB_REPO: "git@gitlab.hefdi.de:tuda/einf_prog_i/2026/tutorials/${{ steps.locate.outputs.exercise_name }}/Gruppe_76.git"
          BRANCH: "main"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$GITLAB_HOST" >> ~/.ssh/known_hosts

          workdir=$(mktemp -d)
          git clone "$GITLAB_REPO" "$workdir"

          tar -xzf "${{ steps.package.outputs.archive_path }}" --strip-components=1 -C "$workdir"

          cd "$workdir"
          git config user.name "Memphis Herghelegiu"
          git config user.email "memphis.herghelegiu@stud.tu-darmstadt.de"

          git add .
          if ! git diff --cached --quiet; then
            git commit -m "${{ steps.locate.outputs.exercise_name }}"
            git push origin "$BRANCH"
          fi

      - name: Delete release on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Build failed. Deleting release $TAG..."
          gh release delete "$TAG" --yes --cleanup-tag