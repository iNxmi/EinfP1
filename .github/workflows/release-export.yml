name: Package Exercise Submission

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate exercise directory
        id: locate
        run: |
          TAG="${{ github.event.release.tag_name }}"
          RAW_NUM=$(echo "$TAG" | grep -o -E '[0-9]+' | head -n1 || true)

          if [ -n "$RAW_NUM" ]; then
            PADDED_NUM=$(printf "%02d" "$RAW_NUM")
            TARGET_DIR="exercises/uebung$PADDED_NUM"
          fi

          if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
            echo "target_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "No matching directory found from tag ($TAG). Falling back to the first directory in exercises/."
            FIRST_DIR=$(find exercises -mindepth 1 -maxdepth 1 -type d | sort | head -n1)
            if [ -z "$FIRST_DIR" ]; then
              echo "Error: No exercise directory found under exercises/." >&2
              exit 1
            fi
            echo "target_dir=$FIRST_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Package submission archive
        id: package
        run: |
          dir="${{ steps.locate.outputs.target_dir }}"
          matnr_file="library/matrikelnummern.txt"

          if [[ ! -d "$dir" ]]; then
            echo "Error: '$dir' is not a directory" >&2
            exit 1
          fi

          if [[ ! -f "$matnr_file" ]]; then
            echo "Error: Central file '$matnr_file' not found" >&2
            exit 1
          fi

          if [[ ! -f "$dir/erklaerung.txt" ]]; then
            echo "Error: '$dir/erklaerung.txt' not found" >&2
            exit 1
          fi

          base=""
          while IFS=',' read -r matnr _rest || [[ -n "$matnr" ]]; do
            matnr="${matnr//[[:space:]]/}"
            [[ -z "$matnr" || "$matnr" == \#* ]] && continue
            base="${base:+${base}_}${matnr}"
          done < "$matnr_file"

          if [[ -z "$base" ]]; then
            echo "Error: No matriculation numbers found in $matnr_file" >&2
            exit 1
          fi

          # Temporarily copy central file into the exercise directory for inclusion in the archive
          cp "$matnr_file" "$dir/matrikelnummern.txt"

          archive_name="${base}.tar.gz"
          out="$(pwd)/${archive_name}"
          parent="$(cd "$dir/.." && pwd)"
          name="$(basename "$(cd "$dir" && pwd)")"

          (cd "$parent" && find "$name" -type f \( -name '*.txt' -o -name '*.c' -o -name '*.h' \) -print0 \
            | tar -czf "$out" --null -T -)

          echo "archive_path=$out" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload Archive to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.package.outputs.archive_path }}#${{ steps.package.outputs.archive_name }}"

      - name: Delete release on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Build failed. Deleting release $TAG..."
          gh release delete "$TAG" --yes --cleanup-tag
